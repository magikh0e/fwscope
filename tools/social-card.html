<!doctype html>
<html>
<!-- GitHub social preview card (1280x640). Render: msedge --headless=new --window-size=1280,640 --allow-file-access-from-files --screenshot=assets/social-preview.png tools/social-card.html -->
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body { width: 1280px; height: 640px; overflow: hidden; background: #0d0d0d; font-family: "Segoe UI", system-ui, sans-serif; color: #f0efec; }
  .frame { position: absolute; inset: 0; background:
      radial-gradient(900px 500px at 85% 20%, rgba(57,135,229,.18), transparent 60%),
      radial-gradient(700px 420px at 10% 100%, rgba(213,81,129,.12), transparent 60%), #111110; }
  .left { position: absolute; left: 72px; top: 92px; width: 520px; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand img { width: 108px; height: 108px; }
  h1 { font: 700 76px/1 "Cascadia Code", Consolas, ui-monospace, monospace; margin: 0; letter-spacing: -1px; }
  .tag { font: 400 26px/1.3 "Cascadia Code", Consolas, ui-monospace, monospace; color: #898781; margin: 26px 0 0; }
  .tag b { color: #c3c2b7; font-weight: 400; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 34px; }
  .chip { font-size: 19px; padding: 7px 14px; border-radius: 999px; background: #1f1f1d; border: 1px solid rgba(255,255,255,.10); color: #c3c2b7; }
  .chip i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; vertical-align: 1px; }
  .foot { position: absolute; left: 72px; bottom: 70px; width: 520px; font-size: 21px; line-height: 1.4; color: #898781; }
  .foot b { color: #f0efec; font-weight: 600; }
  .shot { position: absolute; left: 640px; top: 70px; width: 600px; height: 500px; border-radius: 14px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.12); box-shadow: 0 30px 80px rgba(0,0,0,.55); background: #1a1a19; }
  .shot img { position: absolute; width: 1280px; left: -14px; top: -340px; transform-origin: 0 0; transform: scale(0.95); }
  .fade { position: absolute; left: 0; right: 0; bottom: 0; height: 90px; background: linear-gradient(transparent, #1a1a19); }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="left">
    <div class="brand"><img src="../assets/logo.svg" alt=""><h1>fwscope</h1></div>
    <p class="tag">// firewall, WAF &amp; IDS<br><b>log visualizer</b></p>
    <div class="chips">
      <span class="chip"><i style="background:#d55181"></i>UFW / nftables / OpenWrt</span>
      <span class="chip"><i style="background:#c98500"></i>OPNsense / pfSense</span>
      <span class="chip"><i style="background:#3987e5"></i>Windows / AWS / Azure</span>
      <span class="chip"><i style="background:#008300"></i>ModSecurity / Cloudflare</span>
      <span class="chip"><i style="background:#8a6fd1"></i>Suricata / fail2ban</span>
    </div>
  </div>
  <div class="foot"><b>One HTML file, no install.</b><br>Runs offline in your browser. Your logs never leave it.</div>
  <div class="shot"><img src="../assets/screenshot.png" alt=""><div class="fade"></div></div>
</body>
</html>
