title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: Ideas for fwscope. What would you like to see or work out from your logs?
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to find out or do?
      description: The question you have about your logs, or the thing that's awkward today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How fwscope could help. A rough sketch is fine.
  - type: dropdown
    id: logs
    attributes:
      label: Which logs is this about?
      multiple: true
      options:
        - UFW / iptables
        - OPNsense / pfSense
        - Windows Firewall
        - ModSecurity / Coraza
        - Something else
